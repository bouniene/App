<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Sheet Grid Editor</title>
    <meta name="theme-color" content="#674ea7"/>

    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cairo:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-purple: #674ea7;
            --primary-purple-hover: #543d8a;
            --grid-border: #e2e8f0;
            --grid-header-bg: #f8fafc;
            --grid-row-hover: #f1f5f9;
            --cell-active: #674ea7;
            --cell-font-size: 12px;
            --row-height: 28px;
        }

        body {
            font-family: 'Inter', 'Cairo', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            user-select: none;
            overflow-x: hidden;
        }

        .app-container {
            padding: 0.75rem 1.25rem;
        }

        /* --- Header & Action Bar --- */
        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.6rem;
            margin-bottom: 0.75rem;
            border-bottom: 1px solid #e2e8f0;
        }

        .control-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0.75rem;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            gap: 0.5rem;
            margin-bottom: 0.6rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }

        .btn-purple {
            background-color: var(--primary-purple);
            color: #ffffff;
            border: none;
        }
        .btn-purple:hover {
            background-color: var(--primary-purple-hover);
            color: #ffffff;
        }

        .tab-btn.active {
            background-color: var(--primary-purple) !important;
            color: #fff !important;
            border-color: var(--primary-purple) !important;
        }

        /* --- Ultra-Compact Spreadsheet Grid --- */
        .sheet-wrapper {
            background: #ffffff;
            border: 1px solid var(--grid-border);
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            overflow: auto;
            max-height: calc(100vh - 195px);
            min-height: 520px;
            position: relative;
        }

        .sheet-table {
            width: 100%;
            border-collapse: collapse;
            font-size: var(--cell-font-size);
            table-layout: fixed;
        }

        .sheet-table th {
            background-color: var(--grid-header-bg);
            color: #475569;
            font-weight: 600;
            font-size: 11.5px;
            padding: 4px 6px;
            height: var(--row-height);
            border: 1px solid var(--grid-border);
            position: sticky;
            top: 0;
            z-index: 10;
            white-space: nowrap;
            text-align: left;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .sheet-table th:hover {
            background-color: #ede9fe;
            color: var(--primary-purple);
        }

        .sheet-table th.no-sort {
            cursor: default;
        }
        .sheet-table th.no-sort:hover {
            background-color: var(--grid-header-bg);
            color: #475569;
        }

        .sheet-table th .sort-indicator {
            font-size: 10px;
            margin-left: 4px;
            color: var(--primary-purple);
        }

        .sheet-table td {
            border: 1px solid var(--grid-border);
            padding: 0;
            margin: 0;
            min-height: var(--row-height);
            background: #fff;
            position: relative;
            vertical-align: middle;
        }

        .sheet-table td.row-num {
            background-color: #f8fafc;
            text-align: center;
            font-weight: 600;
            color: #94a3b8;
            font-size: 11px;
            width: 38px;
            user-select: none;
            border-right: 1px solid #cbd5e1;
        }

        .sheet-table tr:hover td:not(.row-num) {
            background-color: var(--grid-row-hover);
        }

        /* --- Standard Inputs --- */
        .sheet-input {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            padding: 3px 6px;
            background: transparent;
            font-family: inherit;
            font-size: var(--cell-font-size);
            color: #1e293b;
            box-sizing: border-box;
        }

        .sheet-input:focus {
            box-shadow: inset 0 0 0 2px var(--cell-active);
            background: #ffffff;
            z-index: 2;
        }

        .sheet-select {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            padding: 2px 4px;
            font-size: var(--cell-font-size);
            cursor: pointer;
        }
        .sheet-select:focus {
            box-shadow: inset 0 0 0 2px var(--cell-active);
        }

        /* --- Multi Foil Tags Component --- */
        .foil-cell-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: var(--row-height);
            padding: 2px 4px;
            gap: 3px;
            width: 100%;
        }

        .foil-tags-container {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 2px;
            flex-grow: 1;
        }

        .foil-pill {
            background-color: #ede9fe;
            color: #674ea7;
            border: 1px solid #ddd6fe;
            border-radius: 3px;
            font-size: 10.5px;
            font-weight: 600;
            padding: 1px 4px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            white-space: nowrap;
        }

        .foil-pill .remove-foil {
            cursor: pointer;
            color: #8b5cf6;
            font-size: 11px;
            line-height: 1;
        }

        .foil-pill .remove-foil:hover {
            color: #dc2626;
        }

        .foil-quick-input {
            border: none;
            outline: none;
            background: transparent;
            font-size: 11px;
            min-width: 50px;
            flex-grow: 1;
            padding: 1px 2px;
            color: #1e293b;
        }

        .btn-open-foil-picker {
            border: none;
            background: transparent;
            color: #94a3b8;
            padding: 0 4px;
            font-size: 10px;
            cursor: pointer;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .btn-open-foil-picker:hover {
            color: var(--primary-purple);
            background: #ede9fe;
        }

        /* --- Row Actions (Delete) --- */
        .btn-row-delete {
            border: none;
            background: transparent;
            color: #cbd5e1;
            font-size: 13px;
            padding: 2px 6px;
            cursor: pointer;
            transition: color 0.15s ease;
            display: block;
            margin: auto;
        }
        tr:hover .btn-row-delete {
            color: #94a3b8;
        }
        .btn-row-delete:hover {
            color: #ef4444 !important;
        }

        /* --- Duplicate Cell & Row Styling --- */
        td.cell-duplicate {
            background-color: #ffe4e6 !important;
        }
        .sheet-input.input-duplicate {
            color: #b91c1c !important;
            font-weight: 600;
        }
        .duplicate-icon {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            color: #ef4444;
            font-size: 11px;
            pointer-events: none;
        }

        /* --- Image Cell & Thumbnails --- */
        .img-cell-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .img-thumb {
            width: 22px;
            height: 22px;
            object-fit: cover;
            border-radius: 3px;
            border: 1px solid #cbd5e1;
            transition: transform 0.15s ease;
        }

        .img-placeholder-icon {
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
        }
        .img-placeholder-icon:hover {
            color: var(--primary-purple);
        }

        /* --- Hover Magnifier Preview (1s delay) --- */
        #hover-zoom-preview {
            position: fixed;
            display: none;
            z-index: 9999;
            background: #ffffff;
            padding: 5px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            pointer-events: none;
            animation: fadeInZoom 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #hover-zoom-preview img {
            max-width: 260px;
            max-height: 260px;
            object-fit: contain;
            border-radius: 6px;
            display: block;
        }

        @keyframes fadeInZoom {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        /* --- Dirty Indicators --- */
        tr.row-dirty td.row-num {
            background-color: #fef3c7 !important;
            color: #d97706;
            font-weight: 700;
        }
        tr.row-dirty td.row-num::after {
            content: " •";
            color: #ef4444;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- Shared Category Datalist -->
    <datalist id="category-datalist"></datalist>

    <!-- Shared Foils Datalist -->
    <datalist id="foils-datalist"></datalist>

    <div class="app-container">
        <!-- Top App Bar -->
        <header class="header-panel">
            <div class="d-flex align-items-center gap-2">
                <a href="index.html" class="btn btn-outline-secondary btn-sm" title="Back">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <h5 class="m-0 fw-bold d-flex align-items-center gap-2">
                    <i class="bi bi-grid-3x3 text-purple"></i> 
                    Sample Sheet Grid
                </h5>
                <span id="rows-count-badge" class="badge rounded-pill bg-secondary" style="font-size: 11px;">0 rows</span>

                <button id="save-all-btn" class="btn btn-purple btn-sm px-3 shadow-sm">
                    <i class="bi bi-cloud-arrow-up-fill me-1"></i> Save to Firebase
                </button>
            </div>
        </header>

        <!-- Tool & Filter Bar -->
        <div class="control-bar">
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <!-- Modes -->
                <div class="btn-group btn-group-sm" role="group">
                    <button type="button" class="btn btn-outline-secondary tab-btn active" id="mode-edit-btn">
                        <i class="bi bi-pencil-square me-1"></i> Live Edit Mode
                    </button>
                    <button type="button" class="btn btn-outline-secondary tab-btn" id="mode-add-btn">
                        <i class="bi bi-plus-square-dotted me-1"></i> Bulk Add / Paste
                    </button>
                </div>

                <!-- Instant Search -->
                <div class="input-group input-group-sm" id="search-box-wrapper" style="width: 230px;">
                    <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" id="sheet-filter-input" class="form-control" placeholder="Search name, cat, foil...">
                </div>

                <!-- Duplicate Detection Filter Button -->
                <button id="filter-duplicates-btn" class="btn btn-outline-danger btn-sm" style="display: none;" title="Toggle show duplicates only">
                    <i class="bi bi-copy me-1"></i> Duplicates: <span id="duplicates-count-badge" class="fw-bold">0</span>

            <div class="d-flex align-items-center gap-2 flex-wrap">

                <div class="dropdown">
                    <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside">
                        <i class="bi bi-layout-three-columns me-1"></i> Columns
                    </button>
                    <div class="dropdown-menu dropdown-menu-end shadow p-2" id="column-visibility-menu" style="min-width: 220px; font-size: 13px;">
                        <!-- Generated via JS -->
                    </div>
                </div>

                <!-- Add Row Button -->
                <button id="add-row-btn" class="btn btn-outline-primary btn-sm">
                    <i class="bi bi-plus-lg me-1"></i> Add Row
                </button>

                <!-- Clear grid in Add mode -->
                <button id="clear-add-grid-btn" class="btn btn-outline-danger btn-sm" style="display: none;">
                    <i class="bi bi-eraser me-1"></i> Reset Table
                </button>
            </div>
        </div>

        <!-- Spreadsheet Container -->
        <div class="sheet-wrapper" id="sheet-wrapper">
            <table class="sheet-table" id="sheet-table">
                <thead id="sheet-head">
                    <!-- Populated dynamically -->
                </thead>
                <tbody id="sheet-body">
                    <!-- Populated dynamically -->
                </tbody>
            </table>
        </div>

        <!-- Bottom Status Info -->
        <div class="d-flex justify-content-between align-items-center mt-2 px-1 text-muted" style="font-size: 11.5px;">
            <div>
                <i class="bi bi-info-circle me-1"></i>
                <span>Smart paste cleans empty lines, handles quotes & expands rows automatically.</span>
            </div>

                <i class="bi bi-exclamation-circle-fill me-1"></i> <span id="dirty-count">0</span> unsaved changes
            </div>
        </div>
    </div>

    <!-- Floating Hover Zoom Preview (1s delay) -->
    <div id="hover-zoom-preview">
        <img id="hover-zoom-img" src="" alt="Enlarged Preview">
    </div>

    <!-- Image Action Modal -->
    <div class="modal fade" id="image-action-modal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">

                <div class="modal-header py-2">

                </div>

                    <div class="d-grid gap-2">

                            <i class="bi bi-upload me-1"></i> Upload Image File
                            <input type="file" id="modal-file-input" accept="image/*" hidden>
                        </label>
                        <button type="button" id="modal-url-prompt-btn" class="btn btn-outline-secondary btn-sm">

    <!-- Foil Picker Modal (Multi-Select) -->

                    <div id="foil-checkboxes-list" class="d-flex flex-column gap-1" style="max-height: 320px; overflow-y: auto;">

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase Script Engine -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBPDnVOol10iskGrtgqxlp9a28cQFCemB4",
            authDomain: "nnnnc-48782.firebaseapp.com",
            databaseURL: "https://nnnnc-48782-default-rtdb.firebaseio.com",
            projectId: "nnnnc-48782",
            storageBucket: "nnnnc-48782.firebasestorage.app",
            messagingSenderId: "91157067378",
            appId: "1:91157067378:web:e0a600f956bad0b44234eb",
            measurementId: "G-5D1059BT76"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const database = getDatabase(firebaseApp);

        // Columns Definition
        const COLUMNS = [
            { id: 'actions', label: '', width: '32px', visible: true, type: 'actions', noSort: true },
            { id: 'image', label: 'Photo', width: '45px', visible: true, type: 'image', noSort: true },
            { id: 'name', label: 'Sample Name', width: '220px', visible: true, type: 'text', required: true },
            { id: 'category', label: 'Category', width: '150px', visible: true, type: 'category' },
            { id: 'foilComponents', label: 'Foil Components', width: '260px', visible: true, type: 'multi-foil' },
            { id: 'location', label: 'Location', width: '150px', visible: true, type: 'text' },
            { id: 'status', label: 'Status', width: '125px', visible: true, type: 'select', options: ['Available', 'Not Available', 'Unknown'] },
            { id: 'quantity', label: 'Qty', width: '80px', visible: true, type: 'number' },
            { id: 'description', label: 'Description', width: '200px', visible: true, type: 'text' },
            { id: 'entryDate', label: 'Entry Date', width: '125px', visible: false, type: 'date' }
        ];

        const DEFAULT_CATEGORIES = ['CIMAISE', 'PLINTHE', 'Wall panel', 'CORNICHE', 'CORNIERE', 'CADRE'];

        const App = {
            mode: 'edit',
            samples: [],
            foils: [],
            filteredSamples: [],
            newRows: [],
            dirtyIds: new Set(),
            sortCol: null, // لا يوجد فرز افتراضي لحماية ترتيب اللصق
            sortAsc: true,
            hoverTimer: null,
            activeImageModalTarget: null,
            activeFoilPickerRowIndex: null,
            pendingDelete: null,
            imageModal: null,
            foilPickerModal: null,
            deleteModal: null,
            filterOnlyDuplicates: false,

            async init() {
                this.imageModal = new bootstrap.Modal(document.getElementById('image-action-modal'));
                this.foilPickerModal = new bootstrap.Modal(document.getElementById('foil-picker-modal'));
                this.deleteModal = new bootstrap.Modal(document.getElementById('delete-confirm-modal'));
                this.initBlankAddRows(15);
                this.renderColumnToggleMenu();
                this.bindEvents();
                await this.loadFirebaseData();
            },

            cleanPayload(obj) {
                return JSON.parse(JSON.stringify(obj, (k, v) => {
                    if (v === undefined) return null;
                    if (typeof v === 'number' && isNaN(v)) return null;
                    return v;
                }));
            },

            // --- Load Samples & Foils from Firebase ---
            async loadFirebaseData() {
                this.setSaveStatus('loading', 'Loading data from Firebase...');
                try {
                    const snapshot = await get(ref(database));
                    if (!snapshot.exists()) {
                        this.samples = [];
                        this.foils = [];
                        this.renderGrid();
                        this.setSaveStatus('saved', 'Connected (Empty DB)');
                        return;
                    }

                    const data = snapshot.val();

                    // Parse Foils
                    const rawFoils = Object.values(data.rolls || data.foils || {});
                    this.foils = rawFoils.map(f => ({
                        docId: f.docId || f.id,
                        name: f.name || f.id || "Unnamed Foil",
                        reference: f.reference || (f.groupNumber ? String(f.groupNumber) : "N/A"),
                        raw: f
                    }));

                    const foilsDatalist = document.getElementById('foils-datalist');
                    foilsDatalist.innerHTML = this.foils.map(f => `<option value="${f.name}">`).join('');

                    // Parse Samples
                    const rawSamples = Object.values(data.samples || {}).filter(s => !s.isDeleted);
                    this.samples = rawSamples.map(sample => {
                        const foilNames = (sample.components || []).map(comp => {
                            const targetId = typeof comp === 'object' ? comp.id : comp;
                            const matched = this.foils.find(f => f.docId === targetId || f.name === targetId);
                            return matched ? matched.name : targetId;
                        }).filter(Boolean);

                        return {
                            ...sample,
                            foilComponents: foilNames
                        };
                    });

                    this.dirtyIds.clear();
                    this.updateDirtyIndicator();
                    this.refreshCategoryDatalist();
                    this.applyFilterAndSort();
                    this.setSaveStatus('saved', 'Synced with cloud');
                } catch (err) {
                    console.error("Firebase read error:", err);
                    this.setSaveStatus('error', 'Failed to load data');
                }
            },

            // --- Duplicate Detection Engine ---
            getDuplicateAnalysis() {
                const nameCounts = new Map();
                const duplicateRows = new Set();
                const existingRemoteNames = new Set(this.samples.map(s => (s.name || '').trim().toLowerCase()).filter(Boolean));

                const currentList = (this.mode === 'edit') ? this.samples : this.newRows;

                currentList.forEach(row => {
                    const norm = (row.name || '').trim().toLowerCase();
                    if (norm) {
                        nameCounts.set(norm, (nameCounts.get(norm) || 0) + 1);
                    }
                });

                currentList.forEach((row, idx) => {
                    const norm = (row.name || '').trim().toLowerCase();
                    if (!norm) return;

                    if (this.mode === 'edit') {
                        if (nameCounts.get(norm) > 1) {
                            duplicateRows.add(row.docId || idx);
                        }
                    } else {
                        if (nameCounts.get(norm) > 1 || existingRemoteNames.has(norm)) {
                            duplicateRows.add(idx);
                        }
                    }
                });

                return { duplicateRows, count: duplicateRows.size };
            },

            refreshCategoryDatalist() {
                const datalist = document.getElementById('category-datalist');
                const fromSamples = this.samples.map(s => (s.category || '').trim()).filter(Boolean);
                const fromNew = this.newRows.map(r => (r.category || '').trim()).filter(Boolean);
                const allUnique = [...new Set([...DEFAULT_CATEGORIES, ...fromSamples, ...fromNew])].sort((a,b) => a.localeCompare(b));
                datalist.innerHTML = allUnique.map(cat => `<option value="${cat}">`).join('');
            },

            resolveComponentsPayload(foilNamesList, existingComponents = []) {
                if (!Array.isArray(foilNamesList)) return [];

                return foilNamesList.map(name => {
                    const matched = this.foils.find(f => 
                        f.name.toLowerCase() === name.toLowerCase() || 
                        (f.raw && f.raw.id && f.raw.id.toLowerCase() === name.toLowerCase())
                    );

                    const finalId = matched ? matched.docId : name;
                    const prev = (existingComponents || []).find(c => (typeof c === 'object' ? c.id : c) === finalId);
                    return {
                        id: finalId,
                        points: (prev && prev.points) ? prev.points : []
                    };
                });
            },

            async saveAllToFirebase() {
                const updates = {};
                const now = new Date().toISOString();

                if (this.mode === 'edit') {
                    if (this.dirtyIds.size === 0) {
                        this.setSaveStatus('saved', 'No changes to save');
                        return;
                    }
                    this.setSaveStatus('loading', 'Saving updates...');

                    this.dirtyIds.forEach(docId => {
                        const item = this.samples.find(s => s.docId === docId);
                        if (item) {
                            const locArray = typeof item.location === 'string'
                                ? item.location.split(',').map(l => l.trim()).filter(Boolean)
                                : (Array.isArray(item.location) ? item.location : []);

                            const payload = {
                                ...item,
                                location: locArray,
                                components: this.resolveComponentsPayload(item.foilComponents, item.components),
                                lastUpdated: now
                            };
                            delete payload.foilComponents;
                            updates[`/samples/${docId}`] = payload;
                        }
                    });
                } else {
                    const validRows = this.newRows.filter(r => r.name && r.name.trim() !== '');
                    if (validRows.length === 0) {
                        alert("Please enter at least one sample name to save.");
                        return;
                    }
                    this.setSaveStatus('loading', 'Adding new samples...');

                    validRows.forEach((r, idx) => {
                        const docId = `sample_${Date.now()}_${idx}`;
                        const locArray = typeof r.location === 'string'
                            ? r.location.split(',').map(l => l.trim()).filter(Boolean)
                            : [];

                        updates[`/samples/${docId}`] = {
                            docId: docId,
                            name: r.name.trim(),
                            category: (r.category || '').trim(),
                            location: locArray,
                            status: r.status || 'Unknown',
                            quantity: (r.status === 'Available' && r.quantity) ? parseInt(r.quantity, 10) : null,
                            description: (r.description || '').trim(),
                            imageUrl: r.imageUrl || '',
                            components: this.resolveComponentsPayload(r.foilComponents),
                            entryDate: r.entryDate || null,
                            isArchived: false,
                            lastUpdated: now
                        };
                    });
                }

                try {
                    const cleanData = this.cleanPayload(updates);
                    await update(ref(database), cleanData);
                    this.setSaveStatus('saved', 'Changes saved successfully!');
                    if (this.mode === 'add') {
                        this.initBlankAddRows(15);
                        this.switchMode('edit');
                    }
                    await this.loadFirebaseData();
                } catch (err) {
                    console.error("Save error:", err);
                    this.setSaveStatus('error', 'Error during save');
                    alert("Save failed: " + err.message);
                }
            },

            naturalCompare(a, b) {
                return (a || '').localeCompare(b || '', undefined, { numeric: true, sensitivity: 'base' });
            },

            applyFilterAndSort() {
                const query = (document.getElementById('sheet-filter-input').value || '').toLowerCase().trim();
                let list = (this.mode === 'edit') ? [...this.samples] : [...this.newRows];

                const { duplicateRows, count } = this.getDuplicateAnalysis();

                const dupBtn = document.getElementById('filter-duplicates-btn');
                const dupCountBadge = document.getElementById('duplicates-count-badge');
                if (count > 0) {
                    dupBtn.style.display = 'inline-flex';
                    dupCountBadge.textContent = count;
                } else {
                    dupBtn.style.display = 'none';
                    this.filterOnlyDuplicates = false;
                }
                dupBtn.classList.toggle('active', this.filterOnlyDuplicates);

                if (this.filterOnlyDuplicates) {
                    list = list.filter((row, idx) => duplicateRows.has(this.mode === 'edit' ? row.docId : idx));
                }

                if (query && this.mode === 'edit') {
                    list = list.filter(item => {
                        const nameMatch = (item.name || '').toLowerCase().includes(query);
                        const catMatch = (item.category || '').toLowerCase().includes(query);
                        const foilsStr = Array.isArray(item.foilComponents) ? item.foilComponents.join(' ') : '';
                        const foilMatch = foilsStr.toLowerCase().includes(query);
                        const locStr = Array.isArray(item.location) ? item.location.join(' ') : (item.location || '');
                        const locMatch = locStr.toLowerCase().includes(query);
                        return nameMatch || catMatch || foilMatch || locMatch;
                    });
                }

                // الفرز يتم فقط إذا نقر المستخدم على رأس عمود
                if (this.sortCol && this.sortCol !== 'actions') {
                    list.sort((rowA, rowB) => {
                        let valA = rowA[this.sortCol];
                        let valB = rowB[this.sortCol];

                        if (this.sortCol === 'quantity') {
                            valA = valA == null ? -Infinity : Number(valA);
                            valB = valB == null ? -Infinity : Number(valB);
                            return this.sortAsc ? valA - valB : valB - valA;
                        }

                        if (Array.isArray(valA)) valA = valA.join(', ');
                        if (Array.isArray(valB)) valB = valB.join(', ');

                        const comp = this.naturalCompare(String(valA || ''), String(valB || ''));
                        return this.sortAsc ? comp : -comp;
                    });
                }

                if (this.mode === 'edit') {
                    this.filteredSamples = list;
                } else {
                    this.newRows = list;
                }

                this.renderGrid();
            },

            handleHeaderSort(colId) {
                const col = COLUMNS.find(c => c.id === colId);
                if (!col || col.noSort) return;

                if (this.sortCol === colId) {
                    this.sortAsc = !this.sortAsc;
                } else {
                    this.sortCol = colId;
                    this.sortAsc = true;
                }
                this.applyFilterAndSort();
            },

            getVisibleColumns() {
                return COLUMNS.filter(c => c.visible);
            },

            renderColumnToggleMenu() {
                const menu = document.getElementById('column-visibility-menu');
                menu.innerHTML = `<h6 class="dropdown-header px-1 py-1 text-uppercase" style="font-size:11px;">Toggle Columns</h6>`;
                COLUMNS.forEach(col => {
                    if (col.id === 'actions') return;
                    const item = document.createElement('div');
                    item.className = 'form-check mb-1';
                    item.innerHTML = `
                        <input class="form-check-input col-toggle-chk" type="checkbox" id="chk-${col.id}" data-col-id="${col.id}" ${col.visible ? 'checked' : ''}>
                        <label class="form-check-label" for="chk-${col.id}">${col.label}</label>
                    `;
                    menu.appendChild(item);
                });

                menu.querySelectorAll('.col-toggle-chk').forEach(chk => {
                    chk.addEventListener('change', (e) => {
                        const col = COLUMNS.find(c => c.id === e.target.dataset.colId);
                        if (col) {
                            col.visible = e.target.checked;
                            this.renderGrid();
                        }
                    });
                });
            },

            // --- Multi-Foil Helpers ---
            addFoilToRow(rowIndex, foilName) {
                if (!foilName || !foilName.trim()) return;
                foilName = foilName.trim();

                const targetList = (this.mode === 'edit') ? this.filteredSamples : this.newRows;
                const row = targetList[rowIndex];
                if (!row) return;

                if (!Array.isArray(row.foilComponents)) {
                    row.foilComponents = [];
                }

                if (!row.foilComponents.includes(foilName)) {
                    row.foilComponents.push(foilName);
                    this.markRowDirty(row, rowIndex);
                    this.renderGrid();
                }
            },

            removeFoilFromRow(rowIndex, foilName) {
                const targetList = (this.mode === 'edit') ? this.filteredSamples : this.newRows;
                const row = targetList[rowIndex];
                if (!row || !Array.isArray(row.foilComponents)) return;

                row.foilComponents = row.foilComponents.filter(f => f !== foilName);
                this.markRowDirty(row, rowIndex);
                this.renderGrid();
            },

            markRowDirty(row, rowIndex) {
                if (this.mode === 'edit') {
                    this.dirtyIds.add(row.docId);
                    this.updateDirtyIndicator();
                    const tr = document.querySelector(`#sheet-body tr:nth-child(${rowIndex + 1})`);
                    if (tr) tr.classList.add('row-dirty');
                }
            },

            openFoilPickerModal(rowIndex) {
                this.activeFoilPickerRowIndex = rowIndex;
                const targetList = (this.mode === 'edit') ? this.filteredSamples : this.newRows;
                const row = targetList[rowIndex];
                if (!row) return;

                const currentFoils = Array.isArray(row.foilComponents) ? row.foilComponents : [];
                document.getElementById('foil-picker-title').textContent = `Foils for: ${row.name || 'Sample'}`;
                
                const searchInput = document.getElementById('foil-picker-search');
                searchInput.value = '';

                const renderCheckboxes = (filterText = '') => {
                    const listContainer = document.getElementById('foil-checkboxes-list');
                    listContainer.innerHTML = '';

                    const filtered = this.foils.filter(f => 
                        f.name.toLowerCase().includes(filterText.toLowerCase()) || 
                        (f.reference && f.reference.toLowerCase().includes(filterText.toLowerCase()))
                    );

                    if (filtered.length === 0) {
                        listContainer.innerHTML = `<span class="text-muted small p-2">No foils found</span>`;
                        return;
                    }

                    filtered.forEach(foil => {
                        const isChecked = currentFoils.includes(foil.name);
                        const item = document.createElement('label');
                        item.className = 'form-check d-flex align-items-center gap-2 p-1 rounded hover-bg cursor-pointer';
                        item.innerHTML = `
                            <input class="form-check-input m-0" type="checkbox" value="${foil.name}" ${isChecked ? 'checked' : ''}>
                            <span class="small fw-semibold">${foil.name}</span>
                            <span class="text-muted small ms-auto" style="font-size:10.5px;">Ref: ${foil.reference}</span>
                        `;

                        item.querySelector('input').addEventListener('change', (e) => {
                            if (e.target.checked) {
                                this.addFoilToRow(rowIndex, foil.name);
                            } else {
                                this.removeFoilFromRow(rowIndex, foil.name);
                            }
                        });

                        listContainer.appendChild(item);
                    });
                };

                renderCheckboxes();
                searchInput.oninput = (e) => renderCheckboxes(e.target.value);

                document.getElementById('foil-picker-clear-btn').onclick = () => {
                    row.foilComponents = [];
                    this.markRowDirty(row, rowIndex);
                    this.renderGrid();
                    renderCheckboxes();
                };

                this.foilPickerModal.show();
            },

            // --- Delete Row with Confirmation ---
            promptDeleteRow(rowIndex) {
                const targetList = (this.mode === 'edit') ? this.filteredSamples : this.newRows;
                const row = targetList[rowIndex];
                if (!row) return;

                this.pendingDelete = {
                    mode: this.mode,
                    rowIndex: rowIndex,
                    docId: row.docId,
                    name: row.name || 'Unnamed Sample'
                };

                document.getElementById('delete-item-name').textContent = this.pendingDelete.name;
                this.deleteModal.show();
            },

            async executePendingDelete() {
                if (!this.pendingDelete) return;
                const { mode, rowIndex, docId } = this.pendingDelete;

                if (mode === 'edit' && docId) {
                    this.setSaveStatus('loading', 'Deleting sample...');
                    try {
                        const now = new Date().toISOString();
                        await update(ref(database), {
                            [`/samples/${docId}/isDeleted`]: true,
                            [`/samples/${docId}/lastUpdated`]: now
                        });

                        this.samples = this.samples.filter(s => s.docId !== docId);
                        this.dirtyIds.delete(docId);
                        this.updateDirtyIndicator();
                        this.setSaveStatus('saved', 'Deleted successfully');
                    } catch (err) {
                        console.error("Delete error:", err);
                        this.setSaveStatus('error', 'Delete failed');
                        alert("Delete failed: " + err.message);
                        return;
                    }
                } else {
                    this.newRows.splice(rowIndex, 1);
                    if (this.newRows.length === 0) this.initBlankAddRows(5);
                }

                this.pendingDelete = null;
                this.deleteModal.hide();
                this.applyFilterAndSort();
            },

            renderGrid() {
                const head = document.getElementById('sheet-head');
                const body = document.getElementById('sheet-body');
                const visibleCols = this.getVisibleColumns();
                const { duplicateRows } = this.getDuplicateAnalysis();

                // Headers
                let headerHtml = `<tr><th class="row-num no-sort">#</th>`;
                visibleCols.forEach(col => {
                    let sortIcon = '';
                    if (!col.noSort) {
                        if (this.sortCol === col.id) {
                            sortIcon = this.sortAsc ? '<i class="bi bi-arrow-up sort-indicator"></i>' : '<i class="bi bi-arrow-down sort-indicator"></i>';
                        } else {
                            sortIcon = '<i class="bi bi-arrow-down-up text-muted opacity-25 sort-indicator"></i>';
                        }
                    }
                    headerHtml += `<th style="width:${col.width};" data-col-id="${col.id}" class="${col.noSort ? 'no-sort text-center' : ''}">
                        ${col.label} ${sortIcon}
                    </th>`;
                });
                headerHtml += `</tr>`;
                head.innerHTML = headerHtml;

                head.querySelectorAll('th[data-col-id]').forEach(th => {
                    th.addEventListener('click', () => this.handleHeaderSort(th.dataset.colId));
                });

                // Rows
                body.innerHTML = '';
                const dataSource = (this.mode === 'edit') ? this.filteredSamples : this.newRows;
                document.getElementById('rows-count-badge').textContent = `${dataSource.length} rows`;

                dataSource.forEach((row, rowIndex) => {
                    const tr = document.createElement('tr');
                    const isDirty = this.mode === 'edit' && this.dirtyIds.has(row.docId);
                    if (isDirty) tr.classList.add('row-dirty');

                    const rowDuplicateKey = this.mode === 'edit' ? row.docId : rowIndex;
                    const isRowDuplicate = duplicateRows.has(rowDuplicateKey);

                    const rowNumTd = document.createElement('td');
                    rowNumTd.className = 'row-num';
                    rowNumTd.textContent = rowIndex + 1;
                    tr.appendChild(rowNumTd);

                    visibleCols.forEach((col, colIndex) => {
                        const td = document.createElement('td');
                        td.dataset.rowIndex = rowIndex;
                        td.dataset.colIndex = colIndex;
                        td.dataset.colId = col.id;

                        // 0. Actions (Delete button)
                        if (col.type === 'actions') {
                            const delBtn = document.createElement('button');
                            delBtn.type = 'button';
                            delBtn.className = 'btn-row-delete';
                            delBtn.title = 'Delete Row';
                            delBtn.innerHTML = `<i class="bi bi-trash3"></i>`;
                            delBtn.addEventListener('click', (e) => {
                                e.stopPropagation();
                                this.promptDeleteRow(rowIndex);
                            });
                            td.appendChild(delBtn);
                        }
                        // 1. Photo Cell
                        else if (col.type === 'image') {
                            const imgContainer = document.createElement('div');
                            imgContainer.className = 'img-cell-container';

                            if (row.imageUrl) {
                                const img = document.createElement('img');
                                img.src = row.imageUrl;
                                img.className = 'img-thumb';
                                img.addEventListener('mouseenter', (e) => this.startHoverZoom(row.imageUrl, e));
                                img.addEventListener('mouseleave', () => this.stopHoverZoom());
                                imgContainer.appendChild(img);
                            } else {
                                imgContainer.innerHTML = `<i class="bi bi-plus-square img-placeholder-icon" title="Add photo"></i>`;
                            }

                            imgContainer.addEventListener('click', () => this.openImageModal(rowIndex));
                            td.appendChild(imgContainer);
                        } 
                        // 2. Status Select
                        else if (col.type === 'select') {
                            const select = document.createElement('select');
                            select.className = 'sheet-select';
                            col.options.forEach(opt => {
                                const option = document.createElement('option');
                                option.value = opt;
                                option.textContent = opt;
                                if (opt === (row[col.id] || 'Unknown')) option.selected = true;
                                select.appendChild(option);
                            });
                            select.addEventListener('change', (e) => this.updateCellValueDirect(rowIndex, col.id, e.target.value));
                            td.appendChild(select);
                        } 
                        // 3. Category with Shared Datalist
                        else if (col.type === 'category') {
                            const input = document.createElement('input');
                            input.type = 'text';
                            input.className = 'sheet-input';
                            input.setAttribute('list', 'category-datalist');
                            input.value = row.category || '';
                            input.placeholder = 'Select or type...';
                            input.autocomplete = 'off';

                            input.addEventListener('keydown', (e) => this.handleCellKeydown(e, rowIndex, colIndex));
                            input.addEventListener('paste', (e) => this.handleCellPaste(e, rowIndex, colIndex));
                            input.addEventListener('input', (e) => {
                                this.updateCellValueDirect(rowIndex, col.id, e.target.value);
                                this.refreshCategoryDatalist();
                            });

                            td.appendChild(input);
                        } 
                        // 4. Multi Foil Components Cell
                        else if (col.type === 'multi-foil') {
                            const foilWrapper = document.createElement('div');
                            foilWrapper.className = 'foil-cell-wrapper';

                            const tagsContainer = document.createElement('div');
                            tagsContainer.className = 'foil-tags-container';

                            const foilsList = Array.isArray(row.foilComponents) ? row.foilComponents : [];

                            foilsList.forEach(foilName => {
                                const pill = document.createElement('span');
                                pill.className = 'foil-pill';
                                pill.innerHTML = `
                                    ${foilName}
                                    <i class="bi bi-x remove-foil" title="Remove"></i>
                                `;
                                pill.querySelector('.remove-foil').addEventListener('click', (e) => {
                                    e.stopPropagation();
                                    this.removeFoilFromRow(rowIndex, foilName);
                                });
                                tagsContainer.appendChild(pill);
                            });

                            const quickInput = document.createElement('input');
                            quickInput.type = 'text';
                            quickInput.className = 'foil-quick-input';
                            quickInput.placeholder = foilsList.length === 0 ? '+ Foil...' : '+';
                            quickInput.setAttribute('list', 'foils-datalist');
                            quickInput.autocomplete = 'off';

                            quickInput.addEventListener('keydown', (e) => {
                                if (e.key === 'Enter') {
                                    e.preventDefault();
                                    if (quickInput.value.trim()) {
                                        this.addFoilToRow(rowIndex, quickInput.value.trim());
                                        quickInput.value = '';
                                    } else {
                                        this.handleCellKeydown(e, rowIndex, colIndex);
                                    }
                                } else if (e.key === 'Backspace' && !quickInput.value && foilsList.length > 0) {
                                    this.removeFoilFromRow(rowIndex, foilsList[foilsList.length - 1]);
                                } else {
                                    this.handleCellKeydown(e, rowIndex, colIndex);
                                }
                            });

                            quickInput.addEventListener('input', () => {
                                const matched = this.foils.find(f => f.name.toLowerCase() === quickInput.value.trim().toLowerCase());
                                if (matched) {
                                    this.addFoilToRow(rowIndex, matched.name);
                                    quickInput.value = '';
                                }
                            });

                            quickInput.addEventListener('paste', (e) => this.handleCellPaste(e, rowIndex, colIndex));

                            tagsContainer.appendChild(quickInput);
                            foilWrapper.appendChild(tagsContainer);

                            const pickerBtn = document.createElement('button');
                            pickerBtn.type = 'button';
                            pickerBtn.className = 'btn-open-foil-picker';
                            pickerBtn.title = 'Choose foils from list';
                            pickerBtn.innerHTML = `<i class="bi bi-chevron-down"></i>`;
                            pickerBtn.addEventListener('click', () => this.openFoilPickerModal(rowIndex));

                            foilWrapper.appendChild(pickerBtn);
                            td.appendChild(foilWrapper);
                        }
                        // 5. Text & Name Cell (With Duplicate Indicator)
                        else {
                            const input = document.createElement('input');
                            input.type = col.type === 'number' ? 'number' : (col.type === 'date' ? 'date' : 'text');
                            input.className = 'sheet-input';

                            if (col.id === 'name' && isRowDuplicate) {
                                td.classList.add('cell-duplicate');
                                input.classList.add('input-duplicate');
                                td.title = "Duplicate sample name detected!";
                                
                                const dupIcon = document.createElement('i');
                                dupIcon.className = 'bi bi-copy duplicate-icon';
                                td.appendChild(dupIcon);
                            }
                            
                            let val = row[col.id] || '';
                            if (col.id === 'location' && Array.isArray(val)) val = val.join(', ');
                            input.value = val;
                            input.autocomplete = 'off';

                            input.addEventListener('keydown', (e) => this.handleCellKeydown(e, rowIndex, colIndex));
                            input.addEventListener('paste', (e) => this.handleCellPaste(e, rowIndex, colIndex));
                            input.addEventListener('input', (e) => this.updateCellValueDirect(rowIndex, col.id, e.target.value));

                            td.appendChild(input);
                        }

                        tr.appendChild(td);
                    });

                    body.appendChild(tr);
                });
            },

            // 1-Second Hover Zoom
            startHoverZoom(imgUrl, event) {
                this.stopHoverZoom();
                this.hoverTimer = setTimeout(() => {
                    const zoomEl = document.getElementById('hover-zoom-preview');
                    const zoomImg = document.getElementById('hover-zoom-img');
                    zoomImg.src = imgUrl;

                    const x = Math.min(event.clientX + 15, window.innerWidth - 290);
                    const y = Math.min(event.clientY + 15, window.innerHeight - 290);
                    zoomEl.style.left = `${x}px`;
                    zoomEl.style.top = `${y}px`;
                    zoomEl.style.display = 'block';
                }, 1000);
            },

            stopHoverZoom() {
                if (this.hoverTimer) {
                    clearTimeout(this.hoverTimer);
                    this.hoverTimer = null;
                }
                document.getElementById('hover-zoom-preview').style.display = 'none';
            },

            openImageModal(rowIndex) {
                this.activeImageModalTarget = rowIndex;
                const targetList = (this.mode === 'edit') ? this.filteredSamples : this.newRows;
                const row = targetList[rowIndex];
                const previewImg = document.getElementById('modal-image-preview');

                if (row.imageUrl) {
                    previewImg.src = row.imageUrl;
                    previewImg.classList.remove('d-none');
                } else {
                    previewImg.src = '';
                    previewImg.classList.add('d-none');
                }

                document.getElementById('image-modal-title').textContent = row.name ? `Image: ${row.name}` : 'Sample Image';
                this.imageModal.show();
            },

            async uploadImageToImgur(file) {
                const clientId = 'a2752b647621b24';
                const formData = new FormData();
                formData.append('image', file);

                this.setSaveStatus('loading', 'Uploading image...');
                const response = await fetch('https://api.imgur.com/3/image', {
                    method: 'POST',
                    headers: { Authorization: `Client-ID ${clientId}` },
                    body: formData
                });
                const result = await response.json();
                if (result.success) {
                    return result.data.link;
                }
                throw new Error(result.data?.error || 'Imgur upload failed');
            },

            // تعديل الخلية المباشر بدون فرز لتجنب تشتت السطور
            updateCellValueDirect(rowIndex, colId, value) {
                const targetList = (this.mode === 'edit') ? this.filteredSamples : this.newRows;
                const row = targetList[rowIndex];
                if (!row) return;

                if (colId === 'quantity') {
                    value = value === '' ? null : parseInt(value, 10);
                }

                row[colId] = value;
                this.markRowDirty(row, rowIndex);
            },

            // --- مفسر لصق قوي ودقيق يعالج نصوص الإكسيل ويزيل الأسطر الفارغة تماماً ---
            parseClipboardData(text) {
                if (!text) return [];
                const rows = [];
                let row = [];
                let cell = '';
                let inQuotes = false;

                for (let i = 0; i < text.length; i++) {
                    const ch = text[i];
                    const next = text[i + 1];

                    if (ch === '"') {
                        if (inQuotes && next === '"') {
                            cell += '"';
                            i++; // تخطي علامة التنصيص المزدوجة
                        } else {
                            inQuotes = !inQuotes;
                        }
                    } else if (ch === '\t' && !inQuotes) {
                        row.push(cell.trim());
                        cell = '';
                    } else if ((ch === '\r' || ch === '\n') && !inQuotes) {
                        if (ch === '\r' && next === '\n') i++;
                        row.push(cell.trim());
                        // الاحتفاظ بالسطر فقط إذا كان يحتوي على بيانات حقيقية
                        if (row.some(c => c.length > 0)) {
                            rows.push(row);
                        }
                        row = [];
                        cell = '';
                    } else {
                        cell += ch;
                    }
                }

                if (cell.length > 0 || row.length > 0) {
                    row.push(cell.trim());
                    if (row.some(c => c.length > 0)) {
                        rows.push(row);
                    }
                }

                return rows;
            },

            // --- معالج اللصق المتطور مع الحفاظ على تسلسل الأسطر وتوسيع الجدول تلقائياً ---
            handleCellPaste(e, startRowIndex, startColIndex) {
                const clipboardText = (e.clipboardData || window.clipboardData).getData('text');
                if (!clipboardText.includes('\t') && !clipboardText.includes('\n')) return;

                e.preventDefault();

                // 1. تفكيك الأسطر وحذف الأسطر الفارغة بالكامل
                const parsedRows = this.parseClipboardData(clipboardText);
                if (parsedRows.length === 0) return;

                // 2. إيقاف أي فرز نشط لحماية ترتيب السطور أثناء اللصق
                this.sortCol = null;

                const visibleCols = this.getVisibleColumns();
                // حصر الأعمدة القابلة للتعديل والظاهرة فقط
                const editableVisibleCols = visibleCols.filter(c => c.type !== 'actions' && c.type !== 'image');
                
                // تحديد موقع العمود الذي تم النقر عليه
                const clickedCol = visibleCols[startColIndex];
                const targetEditableStartIdx = editableVisibleCols.findIndex(c => c.id === clickedCol?.id);
                if (targetEditableStartIdx === -1) return;

                const targetList = (this.mode === 'edit') ? this.filteredSamples : this.newRows;
                const neededTotalRows = startRowIndex + parsedRows.length;

                // 3. التوسيع التلقائي لعدد الأسطر إن كانت الأسطر الملصوقة أكثر من المتوفر
                while (targetList.length < neededTotalRows) {
                    if (this.mode === 'add') {
                        targetList.push(this.createEmptyRow());
                    } else {
                        const newId = `sample_${Date.now()}_${targetList.length}`;
                        const newSample = {
                            docId: newId,
                            name: '',
                            category: '',
                            foilComponents: [],
                            location: [],
                            status: 'Unknown',
                            quantity: null,
                            imageUrl: '',
                            description: '',
                            entryDate: null,
                            components: [],
                            isArchived: false
                        };
                        this.samples.push(newSample);
                        this.filteredSamples.push(newSample);
                        this.dirtyIds.add(newId);
                    }
                }

                // 4. تفريغ البيانات سطر بسطر وخانة بخانة بثبات تام
                parsedRows.forEach((rowValues, rOffset) => {
                    const currentRowIdx = startRowIndex + rOffset;
                    const targetRow = targetList[currentRowIdx];
                    if (!targetRow) return;

                    rowValues.forEach((cellVal, cOffset) => {
                        const colTargetIdx = targetEditableStartIdx + cOffset;
                        if (colTargetIdx < editableVisibleCols.length) {
                            const col = editableVisibleCols[colTargetIdx];

                            if (col.type === 'multi-foil') {
                                const parsedFoils = cellVal.split(/[,+]/).map(f => f.trim()).filter(Boolean);
                                targetRow.foilComponents = parsedFoils;
                            } else if (col.type === 'quantity') {
                                targetRow.quantity = cellVal === '' ? null : parseInt(cellVal, 10) || null;
                            } else if (col.type === 'location') {
                                targetRow.location = cellVal.split(',').map(l => l.trim()).filter(Boolean);
                            } else {
                                targetRow[col.id] = cellVal;
                            }
                        }
                    });

                    this.markRowDirty(targetRow, currentRowIdx);
                });

                // 5. تحديث الواجهة والقوائم والحفاظ على التركيز
                this.updateDirtyIndicator();
                this.refreshCategoryDatalist();
                this.renderGrid();
                setTimeout(() => this.focusCell(startRowIndex, startColIndex), 30);
            },

            handleCellKeydown(e, rowIndex, colIndex) {
                const totalRows = (this.mode === 'edit') ? this.filteredSamples.length : this.newRows.length;

                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (e.shiftKey) {
                        this.focusCell(rowIndex - 1, colIndex);
                    } else {
                        if (this.mode === 'add' && rowIndex === totalRows - 1) {
                            this.newRows.push(this.createEmptyRow());
                            this.renderGrid();
                        }
                        this.focusCell(rowIndex + 1, colIndex);
                    }
                } else if (e.key === 'ArrowDown') {
                    if (rowIndex + 1 < totalRows) {
                        e.preventDefault();
                        this.focusCell(rowIndex + 1, colIndex);
                    }
                } else if (e.key === 'ArrowUp') {
                    if (rowIndex - 1 >= 0) {
                        e.preventDefault();
                        this.focusCell(rowIndex - 1, colIndex);
                    }
                }
            },

            focusCell(rowIndex, colIndex) {
                const cell = document.querySelector(`td[data-row-index="${rowIndex}"][data-col-index="${colIndex}"] input`);
                if (cell) {
                    cell.focus();
                    if (cell.select) cell.select();
                }
            },

            createEmptyRow() {
                return {
                    name: '',
                    category: '',
                    foilComponents: [],
                    location: '',
                    status: 'Unknown',
                    quantity: '',
                    description: '',
                    imageUrl: '',
                    entryDate: ''
                };
            },

            initBlankAddRows(count = 15) {
                this.newRows = [];
                for (let i = 0; i < count; i++) this.newRows.push(this.createEmptyRow());
            },

            switchMode(newMode) {
                this.mode = newMode;
                this.filterOnlyDuplicates = false;
                this.sortCol = null;
                document.getElementById('mode-edit-btn').classList.toggle('active', newMode === 'edit');
                document.getElementById('mode-add-btn').classList.toggle('active', newMode === 'add');
                document.getElementById('search-box-wrapper').style.display = (newMode === 'edit') ? 'flex' : 'none';
                document.getElementById('clear-add-grid-btn').style.display = (newMode === 'add') ? 'inline-block' : 'none';
                this.applyFilterAndSort();
            },

            updateDirtyIndicator() {
                const tracker = document.getElementById('dirty-tracker-text');
                const countSpan = document.getElementById('dirty-count');
                if (this.mode === 'edit' && this.dirtyIds.size > 0) {
                    tracker.style.display = 'block';
                    countSpan.textContent = this.dirtyIds.size;
                } else {
                    tracker.style.display = 'none';
                }
            },

            setSaveStatus(status, text) {
                const el = document.getElementById('save-status-indicator');
                el.style.display = 'inline-flex';
                if (status === 'loading') {
                    el.innerHTML = `<span class="spinner-border spinner-border-sm text-primary"></span> <span class="text-muted">${text}</span>`;
                } else if (status === 'saved') {
                    el.innerHTML = `<i class="bi bi-check-circle-fill text-success"></i> <span class="text-success">${text}</span>`;
                    setTimeout(() => { el.style.display = 'none'; }, 2500);
                } else if (status === 'error') {
                    el.innerHTML = `<i class="bi bi-exclamation-triangle-fill text-danger"></i> <span class="text-danger">${text}</span>`;
                }
            },

            bindEvents() {
                document.getElementById('mode-edit-btn').addEventListener('click', () => this.switchMode('edit'));
                document.getElementById('mode-add-btn').addEventListener('click', () => this.switchMode('add'));
                document.getElementById('save-all-btn').addEventListener('click', () => this.saveAllToFirebase());
                document.getElementById('sheet-filter-input').addEventListener('input', () => this.applyFilterAndSort());

                document.getElementById('confirm-delete-btn').addEventListener('click', () => this.executePendingDelete());

                document.getElementById('filter-duplicates-btn').addEventListener('click', () => {
                    this.filterOnlyDuplicates = !this.filterOnlyDuplicates;
                    this.applyFilterAndSort();
                });

                document.getElementById('add-row-btn').addEventListener('click', () => {
                    if (this.mode === 'add') {
                        this.newRows.push(this.createEmptyRow());
                        this.renderGrid();
                    } else {
                        const newId = `sample_${Date.now()}`;
                        this.samples.unshift({
                            docId: newId,
                            name: 'New Sample',
                            category: '',
                            foilComponents: [],
                            location: [],
                            status: 'Unknown',
                            quantity: null,
                            imageUrl: '',
                            description: '',
                            entryDate: null,
                            components: []
                        });
                        this.dirtyIds.add(newId);
                        this.updateDirtyIndicator();
                        this.applyFilterAndSort();
                    }
                });

                document.getElementById('clear-add-grid-btn').addEventListener('click', () => {
                    if (confirm("Reset bulk addition table?")) {
                        this.initBlankAddRows(15);
                        this.renderGrid();
                    }
                });

                // Image Modal Events
                document.getElementById('modal-file-input').addEventListener('change', async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    try {
                        const link = await this.uploadImageToImgur(file);
                        this.updateCellValueDirect(this.activeImageModalTarget, 'imageUrl', link);
                        this.renderGrid();
                        this.imageModal.hide();
                    } catch (err) {
                        alert("Upload failed: " + err.message);
                    }
                });

                document.getElementById('modal-url-prompt-btn').addEventListener('click', () => {
                    const url = prompt("Paste direct image URL:");
                    if (url) {
                        this.updateCellValueDirect(this.activeImageModalTarget, 'imageUrl', url.trim());
                        this.renderGrid();
                        this.imageModal.hide();
                    }
                });

                document.getElementById('modal-remove-img-btn').addEventListener('click', () => {
                    this.updateCellValueDirect(this.activeImageModalTarget, 'imageUrl', '');
                    this.renderGrid();
                    this.imageModal.hide();
                });
            }
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
