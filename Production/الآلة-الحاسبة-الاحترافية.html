<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الآلة الحاسبة الاحترافية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-app:#12151a;
    --device:#1d2129;
    --device-2:#242933;
    --panel:#1a1e25;
    --screen-bg:#171309;
    --screen-text:#ffb545;
    --screen-dim:#9c7a3f;
    --accent:#ff7a1a;
    --accent-dark:#e05e00;
    --ok:#3fbf7f;
    --ok-dark:#2e9863;
    --danger:#ef5350;
    --key-num:#2b303b;
    --key-num-text:#eef1f5;
    --key-fn:#333a47;
    --key-fn-text:#c7cedb;
    --border:#333947;
    --text-main:#e7eaf0;
    --text-dim:#8b93a3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:18px; min-height:100vh;
    background:radial-gradient(circle at 30% 0%, #1b2029 0%, var(--bg-app) 60%);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    color:var(--text-main);
  }
  .wrap{max-width:920px; margin:0 auto;}

  /* header */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--device); border:1px solid var(--border);
    padding:12px 16px; border-radius:14px; margin-bottom:14px;
  }
  .topbar h1{margin:0; font-size:1.05rem; font-weight:700; display:flex; align-items:center; gap:8px;}
  .gear-btn{
    background:var(--panel); border:1px solid var(--border); color:var(--text-dim);
    padding:8px 12px; border-radius:10px; cursor:pointer; font-size:0.85rem; font-weight:600;
    display:flex; align-items:center; gap:6px; transition:.15s;
  }
  .gear-btn:hover{color:var(--accent); border-color:var(--accent);}

  /* tabs */
  .tabs{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .tab-btn{
    flex:1; min-width:110px; padding:10px 8px; border:1px solid var(--border); background:var(--device);
    color:var(--text-dim); border-radius:10px; cursor:pointer; font-weight:600; font-size:0.85rem;
    font-family:inherit; transition:.15s; position:relative;
  }
  .tab-btn.active{background:var(--accent); color:#1a1206; border-color:var(--accent);}
  .badge{
    position:absolute; top:-6px; left:-6px; background:var(--danger); color:#fff;
    font-size:0.65rem; min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    padding:0 4px; font-family:'IBM Plex Mono', monospace;
  }

  .panel{
    background:var(--device); border:1px solid var(--border); border-radius:16px;
    padding:16px; box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .hidden{display:none !important;}

  /* ===== SCIENTIFIC CALC ===== */
  .calc-body{max-width:420px; margin:0 auto;}
  .screen{
    background:var(--screen-bg); border:1px solid #2a2214; border-radius:12px;
    padding:16px 14px; margin-bottom:12px; direction:ltr; text-align:left;
  }
  .screen-sub{
    min-height:18px; color:var(--screen-dim); font-family:'IBM Plex Mono', monospace;
    font-size:0.85rem; text-align:right; overflow-x:auto; white-space:nowrap;
  }
  .screen-main{
    color:var(--screen-text); font-family:'IBM Plex Mono', monospace; font-weight:700;
    font-size:2.3rem; text-align:right; overflow-x:auto; white-space:nowrap; letter-spacing:0.5px;
    text-shadow:0 0 12px rgba(255,181,69,.35);
  }
  .mode-strip{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; direction:ltr;}
  .mode-strip span{font-size:0.72rem; color:var(--text-dim); font-family:'IBM Plex Mono', monospace;}
  .mem-dot{width:6px; height:6px; border-radius:50%; background:var(--border); display:inline-block; margin-inline-end:4px;}
  .mem-dot.on{background:var(--accent);}

  .keys{direction:ltr; display:grid; grid-template-columns:repeat(5, 1fr); gap:7px;}
  .key{
    border:none; border-radius:10px; padding:12px 4px; cursor:pointer; font-family:'IBM Plex Mono', monospace;
    font-size:0.95rem; font-weight:600; background:var(--key-fn); color:var(--key-fn-text);
    transition:transform .05s, filter .1s; user-select:none;
  }
  .key:active{transform:scale(.94); filter:brightness(1.15);}
  .key.num{background:var(--key-num); color:var(--key-num-text); font-size:1.05rem;}
  .key.op{background:var(--accent); color:#20130a;}
  .key.op:active{background:var(--accent-dark);}
  .key.eq{background:var(--ok); color:#08210f; grid-column:span 1;}
  .key.wide{grid-column:span 2;}
  .key.warn{background:#3a2626; color:#f3a1a1;}
  .key.active-mode{outline:2px solid var(--accent);}

  /* ===== FACTORY CALC ===== */
  .factory-grid{display:grid; grid-template-columns:1fr 1.5fr; gap:14px;}
  @media (max-width:760px){.factory-grid{grid-template-columns:1fr;}}
  .sub-card{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px;}
  label{display:block; margin-bottom:6px; font-weight:600; font-size:0.82rem; color:var(--text-dim);}
  textarea{
    width:100%; height:280px; padding:10px; background:#12151a; color:var(--text-main);
    border:1px solid var(--border); border-radius:8px; font-family:'IBM Plex Mono', monospace;
    font-size:13px; resize:vertical; direction:ltr; text-align:left;
  }
  textarea:focus, input:focus{outline:2px solid var(--accent); border-color:transparent;}
  .mode-switch-btn{
    background:none; border:none; color:var(--accent); font-size:0.8rem; cursor:pointer;
    text-decoration:underline; float:left; font-family:inherit;
  }
  .input-row{display:flex; gap:5px; margin-bottom:6px; direction:ltr;}
  .input-row input{
    padding:7px; border:1px solid var(--border); border-radius:6px; font-size:13px;
    background:#12151a; color:var(--text-main);
  }
  .inp-model{flex:2;} .inp-box, .inp-extra{flex:1; text-align:center;}
  .btn-del{background:#3a2626; color:#f3a1a1; border:none; border-radius:6px; width:30px; cursor:pointer; font-weight:bold;}
  .btn-del:hover{background:var(--danger); color:#fff;}
  .btn-add{background:var(--ok); color:#08210f; border:none; padding:9px; border-radius:8px; cursor:pointer; width:100%; font-weight:700; margin-top:4px;}
  .btn-save-hist{background:var(--accent); color:#20130a; border:none; padding:9px 14px; border-radius:8px; cursor:pointer; font-weight:700; font-size:0.85rem;}

  table{width:100%; border-collapse:separate; border-spacing:0; margin-top:8px; border:1px solid var(--border); border-radius:8px; overflow:hidden; direction:ltr;}
  th{background:#0f1216; color:#c9cfda; font-weight:700; padding:8px 10px; text-align:center; font-size:0.78rem;}
  td{padding:6px 10px; border-bottom:1px solid var(--border); text-align:center; font-size:0.88rem; color:var(--text-main);}
  tbody tr:nth-child(even){background:#191d24;}
  tbody tr:hover{background:#20252e;}
  td:first-child{text-align:left; font-weight:500;}
  td:nth-child(n+2){font-family:'IBM Plex Mono', monospace;}
  tfoot tr{background:#1a1408 !important;}
  tfoot td{font-weight:bold; padding:10px; border-top:2px solid var(--accent); color:var(--screen-text);}
  .clickable-cell{cursor:pointer; position:relative;}
  .clickable-cell:active{background:#204d33 !important;}
  .copied-tooltip{
    position:absolute; top:-24px; left:50%; transform:translateX(-50%); background:#000; color:#fff;
    padding:3px 8px; border-radius:4px; font-size:11px; opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .show-tooltip .copied-tooltip{opacity:1;}

  /* ===== REVERSE ===== */
  .reverse-body{max-width:520px; margin:0 auto; text-align:center;}
  .rev-input-group{margin-bottom:16px; text-align:right;}
  .rev-input-group input{
    width:100%; padding:10px; margin-top:5px; border:1px solid var(--border); border-radius:8px;
    box-sizing:border-box; background:#12151a; color:var(--text-main); direction:ltr; text-align:left;
  }
  .rev-result-box{
    background:var(--panel); border:1px solid var(--accent); border-radius:12px; padding:20px;
    display:flex; justify-content:center; align-items:center; gap:26px;
  }
  .rev-num{font-size:2.3rem; font-weight:700; color:var(--screen-text); line-height:1; font-family:'IBM Plex Mono', monospace;}
  .rev-label{font-size:0.75rem; font-weight:700; color:var(--text-dim);}

  /* ===== HISTORY ===== */
  .hist-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .hist-clear{background:none; border:1px solid var(--danger); color:var(--danger); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:0.8rem; font-family:inherit;}
  .hist-list{display:flex; flex-direction:column; gap:8px; max-height:520px; overflow-y:auto;}
  .hist-item{
    background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 12px;
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
  }
  .hist-icon{font-size:1.1rem; flex-shrink:0;}
  .hist-main{flex:1; min-width:0;}
  .hist-title{font-family:'IBM Plex Mono', monospace; font-size:0.92rem; color:var(--text-main); word-break:break-word;}
  .hist-time{font-size:0.72rem; color:var(--text-dim); margin-top:2px;}
  .hist-del{background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:1rem; flex-shrink:0;}
  .hist-del:hover{color:var(--danger);}
  .empty-note{color:var(--text-dim); text-align:center; padding:30px 10px; font-size:0.9rem;}

  /* ===== MODAL ===== */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:999;
  }
  .modal{
    background:var(--device); width:90%; max-width:440px; max-height:80vh; border:1px solid var(--border);
    border-radius:14px; padding:18px; display:flex; flex-direction:column;
  }
  .modal-body{overflow-y:auto; flex:1; margin:14px 0;}
  .settings-row{display:grid; grid-template-columns:2fr 1fr 30px; gap:8px; margin-bottom:8px; direction:ltr;}
  .settings-row input{padding:7px; border:1px solid var(--border); border-radius:6px; background:#12151a; color:var(--text-main);}
  .btn-save{background:var(--accent); color:#20130a; border:none; padding:10px; border-radius:8px; width:100%; cursor:pointer; font-weight:700;}
  .btn-plain{background:#252b35; color:var(--text-dim); border:none; padding:8px; border-radius:8px; width:100%; margin-bottom:10px; cursor:pointer;}
  .btn-cancel{background:transparent; color:var(--text-dim); border:none; margin-top:8px; cursor:pointer;}
  .loading-note{text-align:center; padding:40px; color:var(--text-dim);}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <h1>🧮 الآلة الحاسبة الاحترافية</h1>
    <button class="gear-btn" onclick="openSettings()">⚙️ إعدادات المنتجات</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="sci" onclick="switchTab('sci')">الحاسبة العلمية</button>
    <button class="tab-btn" data-tab="factory" onclick="switchTab('factory')">حاسبة المصنع</button>
    <button class="tab-btn" data-tab="reverse" onclick="switchTab('reverse')">الحاسبة العكسية</button>
    <button class="tab-btn" data-tab="history" onclick="switchTab('history')">السجل<span id="histBadge" class="badge hidden">0</span></button>
  </div>

  <!-- SCIENTIFIC -->
  <div id="tab-sci" class="panel">
    <div class="calc-body">
      <div class="mode-strip">
        <span><span id="memDot" class="mem-dot"></span>الذاكرة: <span id="memVal">0</span></span>
        <span id="angleLabel">DEG</span>
      </div>
      <div class="screen">
        <div class="screen-sub" id="screenSub">&nbsp;</div>
        <div class="screen-main" id="screenMain">0</div>
      </div>
      <div class="keys" id="sciKeys"></div>
    </div>
  </div>

  <!-- FACTORY -->
  <div id="tab-factory" class="panel hidden">
    <div class="factory-grid">
      <div class="sub-card">
        <button class="mode-switch-btn" id="toggleInputModeBtn" onclick="toggleInputMode()">التبديل إلى إدخال جدولي</button>
        <h3 style="margin:0 0 10px 0; font-size:1rem;">بيانات الإدخال</h3>
        <div id="textInputContainer">
          <textarea id="inputData" placeholder="الصيغة: الموديل عدد_الصناديق زيادة&#10;مثال:&#10;207 30 9&#10;100 10"></textarea>
        </div>
        <div id="tableInputContainer" class="hidden">
          <div id="manualRowsContainer"></div>
          <button class="btn-add" onclick="addManualRow()">+ إضافة سطر</button>
        </div>
      </div>

      <div class="sub-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;">
          <h3 style="margin:0; font-size:1rem;">النتائج</h3>
          <div style="display:flex; gap:8px; align-items:center;">
            <small style="color:var(--text-dim)">اضغط للنسخ</small>
            <button class="btn-save-hist" onclick="saveFactoryToHistory()">💾 حفظ في السجل</button>
          </div>
        </div>
        <table id="resultsTable">
          <thead>
            <tr>
              <th style="width:35%;">الموديل</th>
              <th style="width:15%;">صناديق</th>
              <th style="width:15%;">زيادة</th>
              <th style="width:15%;">مجموع القطع</th>
              <th style="width:20%;">المجموع النهائي</th>
            </tr>
          </thead>
          <tbody id="resultsBody"></tbody>
          <tfoot>
            <tr class="total-row">
              <td style="text-align:right;">المجموع الكلي:</td>
              <td id="sumBoxes">0</td>
              <td id="sumExtras" style="color:#8b93a3;">0</td>
              <td id="sumPiecesInBoxes" style="color:#8b93a3; font-weight:normal;">0</td>
              <td id="sumFinal">0</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </div>

  <!-- REVERSE -->
  <div id="tab-reverse" class="panel hidden">
    <div class="reverse-body">
      <h3 style="margin-bottom:20px;">حاسبة عكسية (قطع ← صناديق)</h3>
      <div class="rev-input-group">
        <label>ابحث واختر المنتج</label>
        <input list="modelDataList" id="revModelSearch" placeholder="اكتب اسم الموديل للبحث..." oninput="calcReverse()">
        <datalist id="modelDataList"></datalist>
      </div>
      <div class="rev-input-group">
        <label>إجمالي القطع</label>
        <input type="number" id="revTotalInput" placeholder="أدخل العدد الإجمالي للقطع..." oninput="calcReverse()">
      </div>
      <div id="revResult" class="hidden">
        <div class="rev-result-box">
          <div><span class="rev-num" id="revBoxes">0</span><div class="rev-label">صناديق</div></div>
          <div style="font-size:2rem; color:#4b5261;">+</div>
          <div><span class="rev-num" id="revExtras" style="color:var(--text-dim);">0</span><div class="rev-label">زيادة</div></div>
        </div>
        <p style="text-align:center; color:var(--text-dim); margin-top:12px; font-size:0.85rem;">
          بناءً على <span id="revPackSize">0</span> قطعة/صندوق
        </p>
        <div style="margin-top:14px;">
          <button class="btn-save-hist" onclick="saveReverseToHistory()">💾 حفظ في السجل</button>
        </div>
      </div>
    </div>
  </div>

  <!-- HISTORY -->
  <div id="tab-history" class="panel hidden">
    <div class="hist-toolbar">
      <h3 style="margin:0; font-size:1rem;">سجل العمليات السابقة</h3>
      <button class="hist-clear" onclick="clearHistory()">مسح الكل</button>
    </div>
    <div id="histList" class="hist-list">
      <div class="loading-note">جاري التحميل...</div>
    </div>
  </div>
</div>

<div id="settingsModal" class="modal-overlay">
  <div class="modal">
    <h2 style="margin-top:0;">⚙️ إعدادات المنتجات</h2>
    <div class="modal-body" id="settingsList"></div>
    <button class="btn-plain" onclick="addSettingRow()">+ إضافة موديل جديد</button>
    <button class="btn-save" onclick="saveSettings()">حفظ التغييرات</button>
    <button class="btn-cancel" onclick="closeSettings()">إلغاء</button>
  </div>
</div>

<script>
/* ============ SHARED STORAGE HELPERS ============ */
const defaultData = {
  '200': 40, '201': 65, '202': 30, '203': 72, '204': 104, '206': 120, '207': 50, '208': 29, '209': 66,
  '100': 24, '101': 12, '103': 37, '104': 18, '105': 24, '106': 20, '109': 15, '116': 26, '117': 17, '102': 14,
  '300': 14, '301': 21, '351': 84, '353': 108, '315': 22,
  '400': 13, '401': 56, '402': 20,
  '700': 77, '701': 44, '702': 25, '703': 66, '704': 21, '705': 22, '706': 15, '707': 0, '708': 36,
  '215': 33, '216': 50, '217': 98
};
let productData = { ...defaultData };
let historyEntries = [];

async function loadProducts(){
  try{
    const r = await window.storage.get('products', false);
    if(r && r.value) productData = JSON.parse(r.value);
  }catch(e){ /* key not found -> keep defaults */ }
}
async function saveProducts(){
  try{ await window.storage.set('products', JSON.stringify(productData), false); }
  catch(e){ console.error('save products failed', e); }
}
async function loadHistory(){
  try{
    const r = await window.storage.get('history_entries', false);
    if(r && r.value) historyEntries = JSON.parse(r.value);
  }catch(e){ historyEntries = []; }
}
async function saveHistory(){
  try{ await window.storage.set('history_entries', JSON.stringify(historyEntries.slice(0,300)), false); }
  catch(e){ console.error('save history failed', e); }
}
function addHistory(type, icon, title){
  historyEntries.unshift({ type, icon, title, ts: Date.now() });
  saveHistory();
  renderHistory();
}
function timeAgoLabel(ts){
  const d = new Date(ts);
  return d.toLocaleString('ar-DZ', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function renderHistory(){
  const list = document.getElementById('histList');
  const badge = document.getElementById('histBadge');
  if(historyEntries.length === 0){
    list.innerHTML = '<div class="empty-note">لا توجد عمليات محفوظة بعد. اضغط "=" في الحاسبة العلمية أو "حفظ في السجل" في التبويبات الأخرى.</div>';
  }else{
    list.innerHTML = historyEntries.map((h, idx) => `
      <div class="hist-item">
        <div class="hist-icon">${h.icon}</div>
        <div class="hist-main">
          <div class="hist-title">${h.title}</div>
          <div class="hist-time">${timeAgoLabel(h.ts)}</div>
        </div>
        <button class="hist-del" onclick="deleteHistoryItem(${idx})">×</button>
      </div>
    `).join('');
  }
  if(historyEntries.length > 0){
    badge.classList.remove('hidden');
    badge.textContent = historyEntries.length > 99 ? '99+' : historyEntries.length;
  }else{
    badge.classList.add('hidden');
  }
}
function deleteHistoryItem(idx){
  historyEntries.splice(idx,1);
  saveHistory();
  renderHistory();
}
function clearHistory(){
  if(historyEntries.length === 0) return;
  if(!confirm('هل تريد حذف كل عمليات السجل نهائياً؟')) return;
  historyEntries = [];
  saveHistory();
  renderHistory();
}

/* ============ TABS ============ */
function switchTab(tab){
  ['sci','factory','reverse','history'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('hidden', t !== tab);
  });
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if(tab === 'reverse') populateReverseDropdown();
  if(tab === 'history') renderHistory();
}

/* ============ SCIENTIFIC CALCULATOR ============ */
let display = '0';
let previous = null;
let operator = null;
let freshEntry = true;
let memory = 0;
let angleMode = 'deg';
let lastResult = 0;
let subLine = '';

const KEY_LAYOUT = [
  {t:'Deg', type:'mode'}, {t:'MC', type:'mem'}, {t:'MR', type:'mem'}, {t:'M+', type:'mem'}, {t:'M-', type:'mem'},
  {t:'sin', type:'func'}, {t:'cos', type:'func'}, {t:'tan', type:'func'}, {t:'log', type:'func'}, {t:'ln', type:'func'},
  {t:'√', type:'func', op:'sqrt'}, {t:'x²', type:'func', op:'square'}, {t:'1/x', type:'func', op:'inv'}, {t:'π', type:'const'}, {t:'e', type:'const'},
  {t:'AC', type:'ac', cls:'warn'}, {t:'CE', type:'ce', cls:'warn'}, {t:'⌫', type:'back'}, {t:'%', type:'percent'}, {t:'^', type:'op', cls:'op'},
  {t:'7', type:'digit', cls:'num'}, {t:'8', type:'digit', cls:'num'}, {t:'9', type:'digit', cls:'num'}, {t:'÷', type:'op', op:'/', cls:'op'}, {t:'x!', type:'func', op:'fact'},
  {t:'4', type:'digit', cls:'num'}, {t:'5', type:'digit', cls:'num'}, {t:'6', type:'digit', cls:'num'}, {t:'×', type:'op', op:'*', cls:'op'}, {t:'±', type:'sign'},
  {t:'1', type:'digit', cls:'num'}, {t:'2', type:'digit', cls:'num'}, {t:'3', type:'digit', cls:'num'}, {t:'−', type:'op', op:'-', cls:'op'}, {t:'ANS', type:'ans'},
  {t:'0', type:'digit', cls:'num wide'}, {t:'.', type:'dot', cls:'num'}, {t:'+', type:'op', op:'+', cls:'op'}, {t:'=', type:'equals', cls:'eq wide'}
];

function buildKeys(){
  const wrap = document.getElementById('sciKeys');
  wrap.innerHTML = KEY_LAYOUT.map((k, i) => {
    const cls = ['key', k.cls || ''].join(' ').trim();
    const id = k.type === 'mode' ? 'id="degBtn"' : '';
    return `<button ${id} class="${cls}" onclick="handleKey(${i})">${k.t}</button>`;
  }).join('');
}

function fmt(n){
  if(!isFinite(n)) return 'خطأ';
  if(Math.abs(n) < 1e-12) n = 0;
  let s = parseFloat(n.toPrecision(12)).toString();
  return s;
}
function toRad(v){ return angleMode === 'deg' ? v * Math.PI / 180 : v; }
function factorial(n){
  n = Math.round(n);
  if(n < 0) return NaN;
  if(n > 170) return Infinity;
  let r = 1;
  for(let i = 2; i <= n; i++) r *= i;
  return r;
}

function updateScreen(){
  document.getElementById('screenMain').textContent = display;
  document.getElementById('screenSub').textContent = subLine || '\u00A0';
  document.getElementById('memVal').textContent = fmt(memory);
  document.getElementById('memDot').classList.toggle('on', memory !== 0);
  document.getElementById('angleLabel').textContent = angleMode.toUpperCase();
  document.getElementById('degBtn').classList.toggle('active-mode', angleMode === 'deg');
}

function handleKey(i){
  const k = KEY_LAYOUT[i];
  const cur = parseFloat(display) || 0;

  switch(k.type){
    case 'digit':
      if(freshEntry){ display = k.t; freshEntry = false; }
      else if(display === '0'){ display = k.t; }
      else { display += k.t; }
      break;
    case 'dot':
      if(freshEntry){ display = '0.'; freshEntry = false; }
      else if(!display.includes('.')) display += '.';
      break;
    case 'op':
      if(operator && !freshEntry) compute();
      previous = parseFloat(display);
      operator = k.op;
      subLine = fmt(previous) + ' ' + k.t;
      freshEntry = true;
      break;
    case 'equals': {
      if(operator === null) break;
      const a = previous, b = cur, opSym = operator;
      compute();
      addHistory('sci', '🧮', `${fmt(a)} ${opLabel(opSym)} ${fmt(b)} = ${display}`);
      operator = null;
      previous = null;
      freshEntry = true;
      subLine = '';
      break;
    }
    case 'func': {
      let r;
      try{
        if(k.op === 'sqrt') r = cur < 0 ? NaN : Math.sqrt(cur);
        else if(k.op === 'square') r = cur * cur;
        else if(k.op === 'inv') r = cur === 0 ? NaN : 1 / cur;
        else if(k.op === 'fact') r = factorial(cur);
        else if(k.t === 'sin') r = Math.sin(toRad(cur));
        else if(k.t === 'cos') r = Math.cos(toRad(cur));
        else if(k.t === 'tan') r = Math.tan(toRad(cur));
        else if(k.t === 'log') r = cur <= 0 ? NaN : Math.log10(cur);
        else if(k.t === 'ln') r = cur <= 0 ? NaN : Math.log(cur);
      }catch(e){ r = NaN; }
      const label = `${k.t}(${fmt(cur)}) = ${fmt(r)}`;
      display = fmt(r);
      addHistory('sci', '🧮', label);
      freshEntry = true;
      break;
    }
    case 'const':
      display = k.t === 'π' ? fmt(Math.PI) : fmt(Math.E);
      freshEntry = true;
      break;
    case 'ac':
      display = '0'; previous = null; operator = null; freshEntry = true; subLine = '';
      break;
    case 'ce':
      display = '0'; freshEntry = true;
      break;
    case 'back':
      if(!freshEntry && display.length > 1) display = display.slice(0, -1);
      else display = '0';
      if(display === '-' || display === '') display = '0';
      break;
    case 'sign':
      if(cur !== 0) display = (cur * -1).toString();
      break;
    case 'percent':
      display = fmt(cur / 100);
      freshEntry = true;
      break;
    case 'mem':
      if(k.t === 'MC'){ memory = 0; }
      else if(k.t === 'MR'){ display = fmt(memory); freshEntry = true; }
      else if(k.t === 'M+'){ memory += cur; }
      else if(k.t === 'M-'){ memory -= cur; }
      break;
    case 'mode':
      angleMode = angleMode === 'deg' ? 'rad' : 'deg';
      break;
    case 'ans':
      display = fmt(lastResult);
      freshEntry = true;
      break;
  }
  updateScreen();
}
function opLabel(op){
  return {'+':'+','-':'−','*':'×','/':'÷','^':'^'}[op] || op;
}
function compute(){
  const a = previous, b = parseFloat(display);
  let r;
  switch(operator){
    case '+': r = a + b; break;
    case '-': r = a - b; break;
    case '*': r = a * b; break;
    case '/': r = b === 0 ? NaN : a / b; break;
    case '^': r = Math.pow(a, b); break;
    default: r = b;
  }
  display = fmt(r);
  lastResult = r;
  previous = r;
}

/* ============ FACTORY CALCULATOR ============ */
const inputArea = document.getElementById('inputData');
const resultsBody = document.getElementById('resultsBody');
const tableInputContainer = document.getElementById('tableInputContainer');
const textInputContainer = document.getElementById('textInputContainer');
const manualRowsContainer = document.getElementById('manualRowsContainer');
let lastFactorySnapshot = null;

function calculateTotal(){
  if(!tableInputContainer.classList.contains('hidden')) syncTableToText();

  const lines = inputArea.value.trim().split('\n');
  resultsBody.innerHTML = '';
  let totalBoxes = 0, totalExtras = 0, totalPcsInBox = 0, grandFinal = 0;
  const rowsSummary = [];

  lines.forEach(line => {
    if(!line.trim() || /^[0-9]+[a-zA-Z]+$/.test(line.trim())) return;
    const parts = line.trim().split(/\s+/);
    if(parts.length < 2) return;

    let modelName, boxCount, extraPieces;
    if(parts.length >= 3 && !isNaN(parts[parts.length - 1]) && !isNaN(parts[parts.length - 2])){
      extraPieces = parseInt(parts.pop(), 10);
      boxCount = parseInt(parts.pop(), 10);
      modelName = parts.join(' ');
    }else{
      extraPieces = 0;
      boxCount = parseInt(parts.pop(), 10);
      modelName = parts.join(' ');
    }
    if(isNaN(boxCount)) return;

    const modelCode = modelName.split('-')[0].trim();
    const piecesPerBox = productData[modelCode] || 0;
    const currentBoxPieces = boxCount * piecesPerBox;
    const currentFinal = currentBoxPieces + extraPieces;

    totalBoxes += boxCount;
    totalExtras += extraPieces;
    totalPcsInBox += currentBoxPieces;
    grandFinal += currentFinal;
    rowsSummary.push(`${modelName}: ${boxCount}×${piecesPerBox}+${extraPieces}=${currentFinal}`);

    const row = resultsBody.insertRow();
    row.innerHTML = `
      <td>
        <div style="font-weight:600; color:var(--text-main)">${modelName}</div>
        <div style="font-size:0.75rem; color:var(--text-dim)">${piecesPerBox} قطعة/صندوق</div>
      </td>
      <td style="font-weight:bold; color:var(--accent); font-size:1.1em">${boxCount}</td>
      <td>${extraPieces > 0 ? extraPieces : '-'}</td>
      <td class="clickable-cell" onclick="copyCell(this)">${currentBoxPieces} <span class="copied-tooltip">تم النسخ!</span></td>
      <td class="clickable-cell" onclick="copyCell(this)" style="font-weight:bold;">${currentFinal} <span class="copied-tooltip">تم النسخ!</span></td>
    `;
  });

  document.getElementById('sumBoxes').textContent = totalBoxes;
  document.getElementById('sumExtras').textContent = totalExtras;
  document.getElementById('sumPiecesInBoxes').textContent = totalPcsInBox;
  document.getElementById('sumFinal').textContent = grandFinal;

  lastFactorySnapshot = { rowsSummary, totalBoxes, totalExtras, totalPcsInBox, grandFinal };
  updateUrlFromText();
}

function saveFactoryToHistory(){
  if(!lastFactorySnapshot || lastFactorySnapshot.rowsSummary.length === 0){
    alert('لا توجد بيانات لحفظها. أدخل بعض الموديلات أولاً.');
    return;
  }
  const s = lastFactorySnapshot;
  const title = `دفعة (${s.rowsSummary.length} موديل) — صناديق:${s.totalBoxes} زيادة:${s.totalExtras} المجموع النهائي:${s.grandFinal}`;
  addHistory('factory', '📦', title);
}

function addManualRow(model='', boxes='', extras=''){
  const div = document.createElement('div');
  div.className = 'input-row';
  div.innerHTML = `
    <input type="text" placeholder="الموديل" class="inp-model" value="${model}" oninput="calculateTotal()">
    <input type="number" placeholder="صندوق" class="inp-box" value="${boxes}" oninput="calculateTotal()">
    <input type="number" placeholder="زيادة" class="inp-extra" value="${extras}" oninput="calculateTotal()">
    <button class="btn-del" tabindex="-1" onclick="this.parentElement.remove(); calculateTotal();">×</button>
  `;
  manualRowsContainer.appendChild(div);
  return div;
}
manualRowsContainer.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){
    e.preventDefault();
    const allInputs = Array.from(manualRowsContainer.querySelectorAll('input'));
    const currentIndex = allInputs.indexOf(e.target);
    if(currentIndex === allInputs.length - 1){
      const newRow = addManualRow();
      newRow.querySelector('.inp-model').focus();
    }else if(currentIndex >= 0){
      allInputs[currentIndex + 1].focus();
      allInputs[currentIndex + 1].select();
    }
  }
});

function toggleInputMode(){
  const isTextMode = textInputContainer.classList.contains('hidden');
  if(isTextMode){
    textInputContainer.classList.remove('hidden');
    tableInputContainer.classList.add('hidden');
    document.getElementById('toggleInputModeBtn').textContent = 'التبديل إلى إدخال جدولي';
    calculateTotal();
  }else{
    textInputContainer.classList.add('hidden');
    tableInputContainer.classList.remove('hidden');
    document.getElementById('toggleInputModeBtn').textContent = 'التبديل إلى إدخال نصي';
    parseTextToTable();
  }
}
function parseTextToTable(){
  manualRowsContainer.innerHTML = '';
  const lines = inputArea.value.trim().split('\n');
  lines.forEach(line => {
    if(!line.trim()) return;
    const parts = line.trim().split(/\s+/);
    if(parts.length < 2) return;
    let model, boxes, extra;
    if(parts.length >= 3 && !isNaN(parts[parts.length-1]) && !isNaN(parts[parts.length-2])){
      extra = parts.pop(); boxes = parts.pop(); model = parts.join(' ');
    }else{
      extra = 0; boxes = parts.pop(); model = parts.join(' ');
    }
    addManualRow(model, boxes, extra);
  });
  if(manualRowsContainer.children.length === 0){
    const row = addManualRow();
    setTimeout(() => row.querySelector('.inp-model').focus(), 50);
  }
}
function syncTableToText(){
  let text = '';
  manualRowsContainer.querySelectorAll('.input-row').forEach(row => {
    const m = row.querySelector('.inp-model').value.trim();
    const b = row.querySelector('.inp-box').value.trim();
    const e = row.querySelector('.inp-extra').value.trim();
    if(m && b) text += `${m} ${b} ${e || 0}\n`;
  });
  inputArea.value = text;
}

/* ============ REVERSE CALCULATOR ============ */
function calcReverse(){
  const model = document.getElementById('revModelSearch').value.trim();
  const total = parseInt(document.getElementById('revTotalInput').value);
  const resultBox = document.getElementById('revResult');
  const perBox = productData[model];

  if(!model || !perBox || isNaN(total) || total < 0){
    resultBox.classList.add('hidden');
    return;
  }
  const boxes = Math.floor(total / perBox);
  const extras = total % perBox;
  document.getElementById('revPackSize').textContent = perBox;
  document.getElementById('revBoxes').textContent = boxes;
  document.getElementById('revExtras').textContent = extras;
  resultBox.classList.remove('hidden');
  resultBox.dataset.model = model;
  resultBox.dataset.total = total;
  resultBox.dataset.boxes = boxes;
  resultBox.dataset.extras = extras;
}
function saveReverseToHistory(){
  const resultBox = document.getElementById('revResult');
  if(resultBox.classList.contains('hidden')) return;
  const { model, total, boxes, extras } = resultBox.dataset;
  addHistory('reverse', '🔁', `${model}: ${total} قطعة ← ${boxes} صندوق + ${extras} زيادة`);
}
function populateReverseDropdown(){
  const dataList = document.getElementById('modelDataList');
  dataList.innerHTML = '';
  Object.keys(productData).sort().forEach(key => {
    const opt = document.createElement('option');
    opt.value = key;
    opt.label = `${productData[key]} قطعة/صندوق`;
    dataList.appendChild(opt);
  });
}

/* ============ SETTINGS MODAL ============ */
function openSettings(){
  const list = document.getElementById('settingsList');
  list.innerHTML = '';
  Object.keys(productData).sort().forEach(key => addSettingRowUI(key, productData[key]));
  document.getElementById('settingsModal').style.display = 'flex';
}
function closeSettings(){ document.getElementById('settingsModal').style.display = 'none'; }
function addSettingRowUI(key='', val=''){
  const div = document.createElement('div');
  div.className = 'settings-row';
  div.innerHTML = `
    <input type="text" placeholder="الموديل" class="set-key" value="${key}">
    <input type="number" placeholder="قطعة" class="set-val" value="${val}">
    <button class="btn-del" onclick="this.parentElement.remove()">×</button>
  `;
  document.getElementById('settingsList').appendChild(div);
}
function addSettingRow(){
  addSettingRowUI();
  const body = document.querySelector('.modal-body');
  body.scrollTop = body.scrollHeight;
}
async function saveSettings(){
  const newMap = {};
  document.querySelectorAll('.settings-row').forEach(row => {
    const key = row.querySelector('.set-key').value.trim();
    const val = parseInt(row.querySelector('.set-val').value.trim());
    if(key && !isNaN(val)) newMap[key] = val;
  });
  productData = newMap;
  await saveProducts();
  closeSettings();
  calculateTotal();
  populateReverseDropdown();
}

/* ============ MISC UTILS ============ */
function copyCell(cell){
  navigator.clipboard.writeText(cell.innerText.split('\n')[0]);
  cell.classList.add('show-tooltip');
  setTimeout(() => cell.classList.remove('show-tooltip'), 800);
}
function updateUrlFromText(){
  const val = inputArea.value.trim();
  history.replaceState(null, '', val ? '#' + encodeURIComponent(val) : window.location.pathname);
}
inputArea.addEventListener('input', calculateTotal);

/* ============ INIT ============ */
(async function init(){
  buildKeys();
  updateScreen();
  await Promise.all([loadProducts(), loadHistory()]);
  renderHistory();
  if(window.location.hash){
    inputArea.value = decodeURIComponent(window.location.hash.substring(1));
  }
  calculateTotal();
  populateReverseDropdown();
})();
</script>
</body>
